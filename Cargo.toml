[package]
name = "ao_mesh"
version = "0.1.0"
edition = "2024"
# MSRV: edition 2024 requires Rust 1.85+. Bump deliberately, never silently.
rust-version = "1.85"
description = "Routing and store-and-forward engine for the aoheyra mesh: sans-IO packet forwarding, flood control, store and sync"
repository = "https://github.com/aoheyra/aoMesh"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["mesh", "routing", "store-and-forward", "bluetooth"]
categories = ["network-programming"]

[features]
# Runtime-neutral async glue, compatible with a Tokio-owned task.
adapter = []
# Deterministic SimWorld scenarios and the CSV metrics report (MSH-27).
# The simulator is host-side tooling, never part of the sans-IO core.
sim = ["adapter", "rand08", "rand"]

[dependencies]
rand_core = "0.9"
# aoIdents seals under rand_core 0.6; the simulator needs a deterministic
# CSPRNG on that trait line. Production callers pass their own CSPRNG.
rand08 = { package = "rand", version = "0.8", optional = true }
# The engine is on rand_core 0.9; rand 0.9 supplies its seeded StdRng.
# The dev-dependency below uses the same package and version.
rand = { version = "0.9", optional = true }
# Pre-release siblings are untagged git sources on their default branches.
# Downstream crates that depend on them directly must use the same untagged
# URLs (no tag, branch or rev), otherwise Cargo builds duplicate Identity,
# LinkId and NodeId types across the mesh seam. Release tags start at v0.1.0
# and will be adopted by every crate together when they are cut.
# Local overrides: docs/local-development.md — never commit a [patch].
ao_network = { version = "0.1.0", git = "https://github.com/aoheyra/aoNetwork" }
ao_idents = { version = "0.1.0", git = "https://github.com/aoheyra/aoIdents" }
# msg_id derivation (MSH-04); the same primitive aoIdents uses per its
# ADR-0001, so one hashing algorithm covers the whole org.
blake3 = "1"

[dev-dependencies]
rand = "0.9"
# aoIdents' sealing API is bounded by rand_core 0.6, the trait line
# rand 0.8 implements; dev-only, for the deterministic test streams
# `SealedMessage::seal` draws its ephemeral from. Production callers
# pass their own CSPRNG.
rand08 = { package = "rand", version = "0.8" }
# Property tests for the packet codec (MSH-03 round-trips and
# never-panics); same pin as aoNetwork, MIT/Apache-2.0.
proptest = { version = "1.8", default-features = false, features = ["std"] }

[[example]]
name = "mesh_adapter"
required-features = ["adapter"]

[[example]]
name = "sim_report"
required-features = ["sim"]

[[example]]
name = "presence_report"
required-features = ["sim"]

[[example]]
