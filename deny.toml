# cargo-deny configuration (MSH-01). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Never add an ignore without the issue ID that justifies it (AGENTS.md §1.1).
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Sibling crates are consumed by git until v0.1.0 tags exist (Cargo.toml).
allow-git = [
    "https://github.com/aoheyra/aoNetwork",
    "https://github.com/aoheyra/aoIdents",
]
